        xmlContent += `<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"\n`;
        xmlContent += ` xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n`;
        xmlContent += ` <Worksheet ss:Name="SIPENA Template">\n`;
        xmlContent += `  <Table>\n`;
        xmlContent += `   <Row>\n`;
        headers.forEach(h => { xmlContent += `    <Cell><Data ss:Type="String">${h}</Data></Cell>\n`; });
        xmlContent += `   </Row>\n`;
        xmlContent += `   <Row>\n`;
        exampleRow.forEach(val => { xmlContent += `    <Cell><Data ss:Type="String">${val}</Data></Cell>\n`; });
        xmlContent += `   </Row>\n`;
        xmlContent += `  </Table>\n`;
        xmlContent += ` </Worksheet>\n`;
        xmlContent += `</Workbook>\n`;

        const blob = new Blob([xmlContent], { type: 'application/vnd.ms-excel;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setUploadProgress(10);
        setValidationErrors([]);

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const fileContent = evt.target.result;
            let lines = [];

            if (file.name.endsWith('.xls') && fileContent.includes('<?xml')) {
              const rowRegex = /<Row>([\s\S]*?)<\/Row>/g;
              const cellRegex = /<Cell><Data[^>]*>([\s\S]*?)<\/Data><\/Cell>/g;
              let rowMatch;
              while ((rowMatch = rowRegex.exec(fileContent)) !== null) {
                const rowText = rowMatch[1];
                let cellMatch;
                const cells = [];
                while ((cellMatch = cellRegex.exec(rowText)) !== null) {
                  cells.push(cellMatch[1].trim());
                }
                if (cells.length > 0) lines.push(cells.join(','));
              }
            } else {
              lines = fileContent.split(/\r?\n/).filter(line => line.trim() !== '');
            }

            if (lines.length < 2) {
              throw new Error('File kosong!');
            }

            const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
            const requiredBaseHeaders = ['NISN', 'Nama', 'Tanggal Lahir (YYYY-MM-DD)', 'Peringkat', 'Status'];
            const missingHeaders = [];

            requiredBaseHeaders.forEach(bh => {
              if (!headers.includes(bh)) missingHeaders.push(bh);
            });

            targetSubjects.forEach(subj => {
              if (!headers.includes(subj)) missingHeaders.push(subj);
            });

            if (missingHeaders.length > 0) {
              throw new Error(`Kolom hilang: ${missingHeaders.join(', ')}`);
            }

            const parsedStudents = [];
            const errors = [];

            for (let i = 1; i < lines.length; i++) {
              const row = lines[i].split(',').map(r => r.trim().replace(/"/g, ''));
              if (row.length < headers.length) continue;

              const dataMap = {};
              headers.forEach((h, index) => { dataMap[h] = row[index]; });

              const nisn = dataMap['NISN'];
              const name = dataMap['Nama'];
              const dob = dataMap['Tanggal Lahir (YYYY-MM-DD)'];
              const rank = parseInt(dataMap['Peringkat']);
              const status = dataMap['Status'];

              if (!/^\d{10}$/.test(nisn)) errors.push(`Baris ${i + 1}: NISN harus 10 digit.`);
              if (!name) errors.push(`Baris ${i + 1}: Nama tidak boleh kosong.`);
              if (!/^\d{4}-\d{2}-\d{2}$/.test(dob)) errors.push(`Baris ${i + 1}: Format lahir salah.`);

              const scores = {};
              targetSubjects.forEach(subj => {
                const val = parseFloat(dataMap[subj]);
                if (isNaN(val)) scores[subj] = 0.00;
                else scores[subj] = parseFloat(val.toFixed(2));
              });

              if (errors.length === 0) {
                parsedStudents.push({
                  id: (students.length + parsedStudents.length + 1).toString(),
                  name, nisn, dob, rank, status, scores
                });
              }
            }

            setUploadProgress(100);
            if (errors.length > 0) {
              setValidationErrors(errors);
              showToast('Impor file gagal!', 'error');
            } else {
              setStudents(prev => [...prev, ...parsedStudents]);
              showToast(`Sukses memuat ${parsedStudents.length} siswa baru!`, 'success');
            }
          } catch (err) {
            setUploadProgress(-1);
            showToast(err.message, 'error');
          }
        };
        reader.readAsText(file);
      };

        </div>
      );
